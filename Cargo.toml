[workspace]
members = ["file_tagger_bevy", "file_tagger_internals", "file_tagger_xilem"]
resolver = "3"

[workspace.package]
authors = ["bigwingbeat"]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anymore = "1.0"
arrayvec = "0.7.8"
bevy = { version = "0.19", default-features = false, features = ["bevy_feathers", "debug", "system_font_discovery", "ui"] }
dirs = "6.0"
estr = { version = "2.0", default-features = false, features = ["std"] }
miette = { version = "7.6", features = ["fancy-no-syscall"] }
replace_with = "0.1"
rfd = "0.17"
rusqlite = { version = "0.40", features = ["extra_check", "modern_sqlite"] }
small_sorted_set = "1.0"
smallvec = { version = "1.16", features = ["union", "const_generics", "const_new"] }
thiserror = "2.0"
usvg = { version = "0.47", default-features = false }
xilem = { path = "../../../src/xilem/xilem" }
